name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  marketplace:
    name: Check the marketplace
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the catalog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the shape and that every pinned tag exists
        run: python3 -B scripts/check_marketplace.py
